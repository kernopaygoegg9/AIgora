<!doctype html>
<!--
  PROTOTYPE — throwaway. Three visual directions for the AIgora UI redesign, on mock data.
  Switch with ?variant=A|B|C&screen=settings|live|consensus|noconsensus|history|record
  (or the floating bar / ← → keys). Not production code; nothing here talks to the backend.
  Serve from the repo root so /assets/... resolves:  python -m http.server 5190 --bind 127.0.0.1
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AIgora UI 原型</title>
<link rel="icon" href="/assets/brand/favicon-32.png" />
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif; }
img.av { border-radius: 50%; flex: none; object-fit: cover; }
button, input, select, textarea { font: inherit; color: inherit; }
p { margin: 0; }
.md p + p { margin-top: .5em; }
.md ul { margin: .3em 0; padding-left: 1.2em; }

/* ---------- prototype switcher (not part of any design) ---------- */
#proto-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 999;
  display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 999px;
  background: #111; color: #fff; font: 12px/1 system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
#proto-bar button { white-space: nowrap; background: #2a2a2a; border: 0; color: #fff; border-radius: 999px; padding: 6px 10px; cursor: pointer; }
#proto-bar button.on { background: #fff; color: #111; }
#proto-bar .lbl { padding: 0 8px; font-weight: 600; white-space: nowrap; }
#proto-bar .sep { width: 1px; height: 18px; background: #444; margin: 0 4px; }

/* ===================================================================
   A — Studio: dark, dense three-pane workspace (sidebar · stage · inspector)
   =================================================================== */
.vA { --bg:#0e1116; --panel:#151a21; --panel2:#1b212a; --line:#262e39; --text:#e6e9ee; --mut:#8b95a3;
  --acc:#7c9cff; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#f5b84b; background: var(--bg); color: var(--text); font-size: 13.5px; }
.vA .shell { display: grid; grid-template-columns: 232px 1fr 300px; height: 100vh; }
.vA .shell.no-insp { grid-template-columns: 232px 1fr; }
.vA aside.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.vA .brand { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; font-weight: 700; font-size: 15px; letter-spacing: .3px; }
.vA .newbtn { margin: 4px 12px 10px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); text-align: left; cursor: pointer; }
.vA .newbtn:hover { border-color: var(--acc); }
.vA .navlbl { padding: 10px 14px 6px; font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .8px; }
.vA .hist-mini { overflow: auto; flex: 1; padding: 0 6px 8px; }
.vA .hist-mini a { display: block; padding: 7px 8px; border-radius: 6px; color: var(--text); text-decoration: none; }
.vA .hist-mini a:hover, .vA .hist-mini a.cur { background: var(--panel2); }
.vA .hist-mini .q { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vA .hist-mini .m { font-size: 11px; color: var(--mut); display: flex; gap: 6px; margin-top: 2px; }
.vA main.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.vA .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.vA .topbar h1 { font-size: 15px; margin: 0; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vA .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--mut); white-space: nowrap; }
.vA .pill.run { color: var(--acc); border-color: #33427a; }
.vA .pill.ok { color: var(--ok); border-color: #1f5a41; }
.vA .pill.bad { color: var(--bad); border-color: #6b2a2a; }
.vA .pill.warn { color: var(--warn); border-color: #6b5222; }
.vA .scroll { flex: 1; overflow: auto; padding: 16px 18px 120px; }
.vA .rnd { margin-bottom: 18px; }
.vA .rnd-h { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mut); margin-bottom: 8px; }
.vA .rnd-h b { color: var(--text); font-size: 13px; }
.vA .rnd-h::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.vA .cols { display: grid; grid-template-columns: repeat(var(--n), minmax(220px, 1fr)); gap: 10px; }
.vA .turn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.vA .turn.failed { border-color: #5a2a2a; background: #1a1416; }
.vA .turn.running { border-color: #33427a; box-shadow: 0 0 0 1px #33427a inset; }
.vA .turn-h { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
.vA .turn-h .n { font-weight: 600; }
.vA .turn-h .st { margin-left: auto; }
.vA .turn .md { color: #cfd5dd; line-height: 1.6; }
.vA .fail { color: var(--bad); font-size: 12.5px; }
.vA .stance { margin-top: 8px; font-size: 11.5px; font-family: Consolas, monospace; }
.vA .stance.AGREE { color: var(--ok); } .vA .stance.DISAGREE { color: var(--bad); }
.vA .between { margin: 10px 0 0; display: grid; grid-template-columns: 1fr 260px; gap: 10px; }
.vA .draft { background: linear-gradient(180deg, #18203a, #151a27); border: 1px solid #2c3966; border-radius: 10px; padding: 10px 12px; }
.vA .blk-h { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--mut); margin-bottom: 6px; }
.vA .blk-h b { color: var(--text); }
.vA .judge { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; }
.vA .bar { height: 6px; background: var(--panel2); border-radius: 3px; position: relative; margin: 8px 0 4px; }
.vA .bar i { position: absolute; inset: 0 auto 0 0; background: var(--warn); border-radius: 3px; }
.vA .bar s { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
.vA .notice { display: flex; gap: 8px; align-items: center; font-size: 12.5px; padding: 6px 10px; border-radius: 8px; margin-top: 8px; background: var(--panel); border: 1px dashed var(--line); color: var(--mut); }
.vA .notice.bad { color: #ffb3b3; border-color: #5a2a2a; }
.vA .dock { position: sticky; bottom: 0; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 18px; display: flex; gap: 8px; align-items: flex-end; }
.vA .dock textarea { flex: 1; resize: none; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; height: 40px; }
.vA .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; white-space: nowrap; }
.vA .btn.pri { background: var(--acc); color: #0b1020; border-color: var(--acc); font-weight: 600; }
.vA .btn.danger { background: transparent; color: var(--bad); border-color: #6b2a2a; }
.vA aside.insp { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 0 0 80px; }
.vA .sec { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.vA .sec h3 { margin: 0 0 8px; font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }
.vA .kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 12.5px; }
.vA .kv span:nth-child(odd) { color: var(--mut); }
.vA .seat { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.vA .seat .s { margin-left: auto; font-size: 11px; }
.vA .seat.removed { opacity: .45; text-decoration: line-through; }
.vA .track { display: grid; grid-template-columns: 70px repeat(3, 1fr); gap: 4px; font-size: 11px; align-items: center; }
.vA .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); justify-self: center; }
.vA .dot.AGREE { background: var(--ok); } .vA .dot.DISAGREE { background: var(--bad); } .vA .dot.failed { background: transparent; border: 1px solid var(--bad); }
.vA .queue li { list-style: none; font-size: 12.5px; padding: 6px 8px; background: var(--panel2); border-radius: 6px; border-left: 2px solid var(--acc); margin-bottom: 4px; }
.vA .queue { padding: 0; margin: 0; }
.vA .queue small { display: block; color: var(--acc); font-size: 11px; }
.vA .form { max-width: 900px; }
.vA .form textarea.q { width: 100%; min-height: 110px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 15px; resize: vertical; }
.vA .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.vA .seg button { border: 0; background: transparent; padding: 7px 14px; cursor: pointer; }
.vA .seg button.on { background: var(--acc); color: #0b1020; font-weight: 600; }
.vA table.pt { width: 100%; border-collapse: collapse; margin-top: 8px; }
.vA table.pt td, .vA table.pt th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; font-weight: normal; }
.vA table.pt th { color: var(--mut); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
.vA table.pt tr.off td { color: var(--mut); }
.vA .fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12.5px; }
.vA .fld label { color: var(--mut); }
.vA .fld select, .vA .fld input { min-width: 0; width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
.vA .radio { display: flex; gap: 8px; align-items: flex-start; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
.vA .radio.on { border-color: var(--acc); background: #161d33; }
.vA .radio.dis { opacity: .5; }
.vA .radio small { display: block; color: var(--mut); }
.vA .result { border-radius: 12px; padding: 14px 16px; margin: 4px 0 18px; border: 1px solid #1f5a41; background: linear-gradient(180deg, #0f2a20, #111a17); }
.vA .result.no { border-color: #6b5222; background: linear-gradient(180deg, #2a2210, #17150f); }
.vA .result h2 { margin: 0 0 8px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.vA table.hist { width: 100%; border-collapse: collapse; }
.vA table.hist td, .vA table.hist th { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; font-weight: normal; }
.vA table.hist th { color: var(--mut); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
.vA table.hist tr:hover td { background: var(--panel); cursor: pointer; }
.vA .stack { display: flex; } .vA .stack img { margin-left: -6px; border: 2px solid var(--bg); } .vA .stack img:first-child { margin-left: 0; }
.vA .ro { font-size: 12px; color: var(--warn); }
.vA .caret::after { content: '▍'; color: var(--acc); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.vA.light { --bg:#f5f6f8; --panel:#ffffff; --panel2:#eef1f5; --line:#dde2e9; --text:#1c2230; --mut:#687385;
  --acc:#3d63dd; --ok:#13854f; --bad:#c9302c; --warn:#a86a00; }
.vA.light .turn .md { color: #2b3242; }
.vA.light .turn.failed { background: #fff6f5; border-color: #f0c9c6; }
.vA.light .turn.running { border-color: #b8c7f5; box-shadow: 0 0 0 1px #b8c7f5 inset; }
.vA.light .draft { background: #f1f5ff; border-color: #c9d6fb; }
.vA.light .radio.on { background: #eef2ff; }
.vA.light .btn.pri, .vA.light .seg button.on { color: #fff; }
.vA.light .pill.run { border-color: #b8c7f5; } .vA.light .pill.ok { border-color: #a9dcc2; } .vA.light .pill.bad { border-color: #f0c9c6; } .vA.light .pill.warn { border-color: #ecd29f; }
.vA.light .notice.bad { color: var(--bad); border-color: #f0c9c6; }
.vA.light .result { background: #effaf4; border-color: #a9dcc2; } .vA.light .result.no { background: #fff8ea; border-color: #ecd29f; }
.vA.light .stack img { border-color: var(--bg); }
.vA .theme { margin: auto 12px 64px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-size: 12px; color: var(--mut); }

/* ===================================================================
   B — Agora: light, warm paper, editorial single column, sentence-style settings
   =================================================================== */
.vB { --bg:#f6f1e9; --paper:#fffdf9; --ink:#2b2622; --mut:#8a8076; --line:#e4dccf; --acc:#b4532a;
  --ok:#2f7d5b; --bad:#b33a2e; --warn:#b07a17; background: var(--bg); color: var(--ink); font-size: 15px; }
.vB .serif { font-family: 'Noto Serif TC', 'Source Han Serif TC', 'PMingLiU', Georgia, serif; }
.vB header.top { display: flex; align-items: center; gap: 10px; padding: 14px 28px; }
.vB header.top .name { font-weight: 700; letter-spacing: .5px; font-size: 17px; }
.vB header.top nav { margin-left: auto; display: flex; gap: 22px; }
.vB header.top nav a { color: var(--mut); text-decoration: none; padding-bottom: 3px; }
.vB header.top nav a.cur { color: var(--ink); border-bottom: 2px solid var(--acc); }
.vB .wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px 140px; }
.vB .hero { text-align: center; padding: 70px 0 20px; }
.vB .hero img { margin-bottom: 8px; }
.vB .hero h1 { font-size: 34px; margin: 0 0 6px; font-weight: 700; }
.vB .hero p { color: var(--mut); }
.vB .composer { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; box-shadow: 0 10px 30px rgba(80,60,30,.08); max-width: 820px; margin: 22px auto 0; }
.vB .composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; font-size: 18px; min-height: 90px; }
.vB .seats { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0; border-top: 1px dashed var(--line); }
.vB .chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 5px; border-radius: 999px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 14px; }
.vB .chip.on { border-color: var(--acc); background: #fbefe8; }
.vB .chip.dis { opacity: .5; cursor: not-allowed; }
.vB .chip small { color: var(--mut); font-size: 11.5px; }
.vB .tag { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: #efe8dc; color: var(--mut); }
.vB .tag.bad { background: #f6e1dd; color: var(--bad); }
.vB .sentence { line-height: 2.3; color: var(--mut); font-size: 15px; padding-top: 6px; border-top: 1px dashed var(--line); }
.vB .sentence .sel { display: inline-block; color: var(--ink); border-bottom: 1.5px solid var(--acc); padding: 0 4px; line-height: 1.4; cursor: pointer; font-weight: 600; }
.vB .sentence .sel.dis { color: var(--mut); border-bottom-style: dotted; font-weight: normal; }
.vB .go { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 10px; }
.vB .btn { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 9px 20px; cursor: pointer; }
.vB .btn.pri { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
.vB .btn.danger { color: var(--bad); border-color: #e5c1bb; background: transparent; }
.vB .qhead { padding: 40px 0 10px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; border-bottom: 1px solid var(--line); }
.vB .qhead .kick { color: var(--acc); font-size: 13px; letter-spacing: 1px; }
.vB .qhead h1 { font-size: 30px; margin: 6px 0 10px; line-height: 1.35; }
.vB .qhead .meta { color: var(--mut); font-size: 13.5px; display: flex; gap: 14px; flex-wrap: wrap; }
.vB .layout { display: grid; grid-template-columns: 120px 1fr; gap: 28px; margin-top: 26px; }
.vB .rail { position: sticky; top: 20px; align-self: start; font-size: 13px; }
.vB .rail a { display: flex; align-items: center; gap: 8px; color: var(--mut); text-decoration: none; padding: 6px 0; }
.vB .rail a.cur { color: var(--ink); font-weight: 600; }
.vB .rail .d { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--line); background: var(--paper); }
.vB .rail .d.done { background: var(--mut); border-color: var(--mut); }
.vB .rail .d.live { border-color: var(--acc); background: var(--acc); box-shadow: 0 0 0 4px #f3d9cc; }
.vB .rail .d.win { background: var(--ok); border-color: var(--ok); }
.vB .rnd { margin-bottom: 40px; }
.vB .rnd h2 { font-size: 13px; letter-spacing: 3px; color: var(--mut); font-weight: 600; margin: 0 0 14px; display: flex; gap: 12px; align-items: center; }
.vB .rnd h2::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.vB .cols { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.vB .col { padding: 0 20px; border-left: 1px solid var(--line); min-width: 0; }
.vB .col:first-child { padding-left: 0; border-left: 0; }
.vB .byline { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.vB .byline .n { font-weight: 700; }
.vB .byline .st { margin-left: auto; font-size: 12px; color: var(--mut); }
.vB .col .md { line-height: 1.8; font-size: 15px; }
.vB .col.failed .md { color: var(--mut); }
.vB .fail { color: var(--bad); font-size: 13.5px; font-style: italic; }
.vB .stance { margin-top: 12px; font-size: 12px; letter-spacing: 2px; font-weight: 700; }
.vB .stance.AGREE { color: var(--ok); } .vB .stance.DISAGREE { color: var(--bad); }
.vB .pull { margin: 26px 0 0; padding: 22px 26px; background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--acc); border-radius: 4px 14px 14px 4px; }
.vB .pull .lbl { font-size: 12px; letter-spacing: 2px; color: var(--acc); font-weight: 700; display: flex; gap: 10px; align-items: center; }
.vB .pull .md { font-size: 17px; line-height: 1.8; margin-top: 8px; }
.vB .verdict { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13.5px; color: var(--mut); flex-wrap: wrap; }
.vB .meter { width: 160px; height: 4px; background: var(--line); position: relative; border-radius: 2px; }
.vB .meter i { position: absolute; inset: 0 auto 0 0; background: var(--warn); border-radius: 2px; }
.vB .meter s { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.vB .margin { font-style: italic; color: var(--mut); font-size: 13.5px; margin-top: 12px; padding-left: 14px; border-left: 2px solid var(--line); }
.vB .margin.bad { color: var(--bad); border-color: #e5c1bb; }
.vB .dock { position: fixed; left: 0; right: 0; bottom: 60px; display: flex; justify-content: center; pointer-events: none; }
.vB .dock .in { pointer-events: auto; width: min(820px, calc(100% - 32px)); background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 34px rgba(80,60,30,.16); padding: 10px 12px; }
.vB .dock .queued { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.vB .dock .queued span { font-size: 12.5px; background: #fbefe8; color: var(--acc); border-radius: 999px; padding: 3px 10px; }
.vB .dock .row { display: flex; gap: 8px; align-items: center; }
.vB .dock input { flex: 1; border: 0; outline: 0; background: transparent; padding: 6px; }
.vB .final { margin: 34px 0 40px; padding: 30px 34px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; position: relative; box-shadow: 0 10px 30px rgba(80,60,30,.08); }
.vB .final::before { content: ''; position: absolute; inset: 8px; border: 1px solid #e9dfcf; border-radius: 12px; pointer-events: none; }
.vB .final .lbl { font-size: 13px; letter-spacing: 3px; color: var(--ok); font-weight: 700; }
.vB .final.no .lbl { color: var(--warn); }
.vB .final h2 { font-size: 24px; margin: 6px 0 14px; }
.vB .final .md { font-size: 16.5px; line-height: 1.85; }
.vB .final .sign { display: flex; gap: 6px; margin-top: 16px; align-items: center; color: var(--mut); font-size: 13px; }
.vB .journal h2.day { font-size: 13px; letter-spacing: 3px; color: var(--mut); margin: 34px 0 6px; }
.vB .entry { display: grid; grid-template-columns: 70px 1fr auto; gap: 18px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: baseline; cursor: pointer; }
.vB .entry:hover h3 { color: var(--acc); }
.vB .entry time { color: var(--mut); font-size: 13px; }
.vB .entry h3 { margin: 0 0 4px; font-size: 19px; font-weight: 700; }
.vB .entry .sub { color: var(--mut); font-size: 13px; display: flex; gap: 10px; align-items: center; }
.vB .ro { background: #efe8dc; padding: 8px 14px; border-radius: 10px; color: var(--mut); font-size: 13.5px; margin-top: 18px; }
.vB .caret::after { content: '｜'; color: var(--acc); animation: blink 1s steps(2) infinite; }

/* ===================================================================
   C — Roundtable: bright, focus-on-current-round, seats on top, round tabs, meters
   =================================================================== */
.vC { --bg:#f3f4fb; --card:#fff; --ink:#1d2140; --mut:#6c7194; --line:#e3e5f2; --acc:#5b5bf0; --acc2:#eceafe;
  --ok:#17a673; --okbg:#e3f7ef; --bad:#e5484d; --badbg:#fde8e8; --warn:#e09b13; --warnbg:#fff4dc; background: var(--bg); color: var(--ink); font-size: 14.5px; }
.vC header.top { display: flex; align-items: center; gap: 10px; padding: 12px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
.vC header.top .name { font-weight: 800; font-size: 17px; }
.vC header.top nav { display: flex; gap: 4px; margin-left: 18px; background: var(--bg); padding: 3px; border-radius: 10px; }
.vC header.top nav a { padding: 6px 14px; border-radius: 8px; color: var(--mut); text-decoration: none; }
.vC header.top nav a.cur { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(30,30,80,.1); }
.vC .wrap { max-width: 1280px; margin: 0 auto; padding: 22px 24px 140px; }
.vC .card { background: var(--card); border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(30,30,80,.04); }
.vC .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 600; }
.vC .btn.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
.vC .btn.danger { background: var(--badbg); border-color: transparent; color: var(--bad); }
.vC h2.step { font-size: 15px; margin: 26px 0 10px; display: flex; gap: 8px; align-items: center; }
.vC h2.step i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center; font-size: 12px; }
.vC .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.vC .tile { position: relative; padding: 16px 12px 12px; text-align: center; cursor: pointer; border: 2px solid var(--line); }
.vC .tile.on { border-color: var(--acc); background: #f7f6ff; }
.vC .tile.on::after { content: '✓'; position: absolute; top: 8px; right: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--acc); color: #fff; font-size: 12px; display: grid; place-items: center; }
.vC .tile.dis { cursor: not-allowed; background: #f6f6f9; }
.vC .tile.dis img { filter: grayscale(1); opacity: .5; }
.vC .tile .n { font-weight: 700; margin-top: 8px; }
.vC .tile .m { color: var(--mut); font-size: 12.5px; }
.vC .tile .tags { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-top: 8px; min-height: 20px; }
.vC .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--mut); font-weight: 600; }
.vC .tag.bad { background: var(--badbg); color: var(--bad); } .vC .tag.ok { background: var(--okbg); color: var(--ok); } .vC .tag.warn { background: var(--warnbg); color: var(--warn); } .vC .tag.acc { background: var(--acc2); color: var(--acc); }
.vC .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.vC .mode { padding: 16px 18px; border: 2px solid var(--line); cursor: pointer; }
.vC .mode.on { border-color: var(--acc); background: #f7f6ff; }
.vC .mode b { font-size: 16px; } .vC .mode p { color: var(--mut); margin-top: 4px; font-size: 13.5px; }
.vC .adv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 18px; padding: 16px 18px; }
.vC .adv .fld { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--mut); }
.vC .adv select, .vC .adv input { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--bg); color: var(--ink); }
.vC .seg { display: flex; gap: 6px; }
.vC .seg span { flex: 1; text-align: center; padding: 7px 8px; border-radius: 9px; border: 1px solid var(--line); color: var(--ink); cursor: pointer; font-size: 13px; }
.vC .seg span.on { border-color: var(--acc); background: var(--acc2); color: var(--acc); font-weight: 600; }
.vC .seg span.dis { opacity: .45; cursor: not-allowed; }
.vC .askbar { position: fixed; left: 0; right: 0; bottom: 60px; display: flex; justify-content: center; }
.vC .askbar .in { width: min(1000px, calc(100% - 32px)); display: flex; gap: 10px; padding: 10px; align-items: center; box-shadow: 0 14px 40px rgba(40,40,120,.18); }
.vC .askbar textarea, .vC .askbar input { flex: 1; border: 0; outline: 0; background: transparent; resize: none; font-size: 15.5px; padding: 6px 8px; }
.vC .table { padding: 16px 20px; display: flex; gap: 22px; align-items: flex-start; }
.vC .table .q { flex: 1; min-width: 0; }
.vC .table .q .k { color: var(--mut); font-size: 12.5px; }
.vC .table .q h1 { font-size: 21px; margin: 2px 0 8px; line-height: 1.35; }
.vC .seatrow { display: flex; gap: 16px; }
.vC .seatc { text-align: center; width: 78px; position: relative; font-size: 12.5px; }
.vC .ring { width: 58px; height: 58px; margin: 0 auto 4px; border-radius: 50%; padding: 3px; background: var(--line); position: relative; }
.vC .ring img { display: block; background: #fff; }
.vC .ring.running { background: conic-gradient(var(--acc) 0 70%, var(--acc2) 70% 100%); animation: spin 1.4s linear infinite; }
.vC .ring.running img { animation: spin 1.4s linear infinite reverse; }
.vC .ring.ok { background: var(--ok); } .vC .ring.failed { background: var(--bad); }
.vC .ring.removed { background: var(--line); } .vC .seatc.removed { opacity: .45; }
.vC .crown { position: absolute; top: -8px; right: 6px; font-size: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.vC .tabs { display: flex; gap: 6px; margin: 18px 0 12px; align-items: center; flex-wrap: wrap; }
.vC .tabs a { padding: 7px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--mut); text-decoration: none; font-weight: 600; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }
.vC .tabs a.cur { background: var(--ink); color: #fff; border-color: var(--ink); }
.vC .tabs a i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .5; }
.vC .tabs a i.live { background: var(--acc); opacity: 1; }
.vC .grid { display: grid; grid-template-columns: 1fr 330px; gap: 16px; align-items: start; }
.vC .cols { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; }
.vC .turn { padding: 14px 16px; min-width: 0; border-top: 4px solid var(--line); }
.vC .turn.ok { border-top-color: var(--ok); } .vC .turn.running { border-top-color: var(--acc); } .vC .turn.failed { border-top-color: var(--bad); background: #fffafa; }
.vC .turn-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.vC .turn-h .n { font-weight: 700; } .vC .turn-h .tag { margin-left: auto; }
.vC .turn .md { line-height: 1.7; }
.vC .fail { color: var(--bad); font-size: 13.5px; }
.vC .side > .card { padding: 14px 16px; margin-bottom: 12px; }
.vC .side h3 { margin: 0 0 10px; font-size: 13px; color: var(--mut); display: flex; align-items: center; gap: 8px; }
.vC .gauge { display: flex; align-items: center; gap: 14px; }
.vC .gauge svg { flex: none; }
.vC .gauge .num { font-size: 26px; font-weight: 800; }
.vC .votes { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.vC .votes div { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.vC .votes .tag { margin-left: auto; }
.vC .draft .md { font-size: 14px; line-height: 1.7; max-height: 220px; overflow: auto; }
.vC .notes { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.vC .note { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 12px; background: var(--warnbg); font-size: 13.5px; }
.vC .note.bad { background: var(--badbg); color: #9b2226; }
.vC .note b { white-space: nowrap; }
.vC .queue span { display: block; font-size: 13px; background: var(--acc2); color: var(--ink); border-radius: 10px; padding: 7px 10px; margin-bottom: 6px; }
.vC .queue small { color: var(--acc); display: block; font-weight: 600; font-size: 11.5px; }
.vC .banner { padding: 22px 24px; border-radius: 18px; color: #fff; background: linear-gradient(120deg, #17a673, #1fb59a); display: flex; gap: 18px; align-items: flex-start; margin-bottom: 16px; }
.vC .banner.no { background: linear-gradient(120deg, #e09b13, #e3b341); }
.vC .banner .big { font-size: 34px; line-height: 1; }
.vC .banner h2 { margin: 0 0 8px; font-size: 19px; }
.vC .banner .md { background: rgba(255,255,255,.95); color: var(--ink); border-radius: 12px; padding: 14px 16px; line-height: 1.75; margin-top: 10px; }
.vC .hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.vC .hcard { padding: 16px 18px; cursor: pointer; border-left: 5px solid var(--line); }
.vC .hcard:hover { box-shadow: 0 6px 20px rgba(40,40,120,.1); }
.vC .hcard.consensus { border-left-color: var(--ok); } .vC .hcard.no_consensus { border-left-color: var(--warn); } .vC .hcard.stopped, .vC .hcard.insufficient_participants { border-left-color: var(--bad); } .vC .hcard.completed { border-left-color: var(--acc); }
.vC .hcard h3 { margin: 6px 0 12px; font-size: 16px; line-height: 1.4; }
.vC .hcard .f { display: flex; align-items: center; gap: 8px; color: var(--mut); font-size: 12.5px; }
.vC .stack { display: flex; } .vC .stack img { margin-left: -8px; border: 2px solid #fff; } .vC .stack img:first-child { margin-left: 0; }
.vC .ro { background: var(--acc2); color: var(--acc); padding: 8px 14px; border-radius: 10px; font-size: 13.5px; font-weight: 600; margin-bottom: 12px; display: inline-block; }
.vC .caret::after { content: '●'; color: var(--acc); font-size: 10px; margin-left: 3px; animation: blink 1s steps(2) infinite; }
</style>
</head>
<body>
<div id="app"></div>
<div id="proto-bar"></div>
<script>
// ------------------------------------------------------------------ mock data
const AV = (f) => `/assets/avatars/${f}`
const ICON = '/assets/brand/app-icon.png'
const P = {
  claude: { name: 'Claude Code', adapter: 'claude', model: 'sonnet', avatar: 'claude.png', web: true, ok: true },
  codex:  { name: 'Codex', adapter: 'codex', model: 'gpt-5-codex', avatar: 'codex.png', web: true, ok: true },
  ollama: { name: 'Ollama', adapter: 'ollama', model: 'llama3.1:8b', avatar: 'ollama.png', web: false, ok: true },
  gemini: { name: 'Gemini', adapter: 'gemini', model: 'gemini-2.5-pro', avatar: 'gemini.png', web: true, ok: false, why: '找不到 gemini CLI' },
  fake:   { name: 'Fake 測試', adapter: 'fake', model: '—', avatar: 'fake.png', web: true, ok: true },
}
const SEL = ['claude', 'codex', 'ollama']
const QUESTION = '小型團隊（5 人）的內部工具，資料庫該用 SQLite 還是 PostgreSQL？'
const R = [
  { n: 1, turns: [
      { id: 'claude', st: 'ok', text: '<p>以 5 人的內部工具來說，<b>SQLite</b> 幾乎足夠：零維運、單一檔案好備份。真正的限制是<b>同時寫入</b>，WAL 模式下讀寫可並行，但寫入仍是單一鎖。</p><p>如果之後要多台機器部署，再遷到 PostgreSQL。</p>' },
      { id: 'codex', st: 'ok', text: '<p>我傾向直接用 <b>PostgreSQL</b>。內部工具很容易長大，等到要加權限、全文搜尋、背景工作時才遷移，成本比一開始就用 PG 高。</p><p>Docker 一行就能起，維運成本其實不高。</p>' },
      { id: 'ollama', st: 'ok', text: '<p>兩者都可以。SQLite 適合單機、讀多寫少；PostgreSQL 適合多人同時寫入與需要擴充的情境。建議依部署方式決定。</p>' },
    ], draft: '<p>以目前規模，<b>SQLite（WAL 模式）</b>即可上線；當出現多台伺服器部署或寫入衝突時，再遷移至 PostgreSQL。</p>', draftBy: 'ollama',
    judge: null },
  { n: 2, turns: [
      { id: 'claude', st: 'ok', stance: 'AGREE', text: '<p>同意草案。補充：從第一天就透過 ORM 存取，遷移時只需換連線字串與少數方言差異。</p>' },
      { id: 'codex', st: 'ok', stance: 'DISAGREE', text: '<p>不同意「之後再遷移」這個前提。遷移的成本常被低估：資料型別、鎖的行為、測試環境都要重做。我建議草案改成「預設 PostgreSQL，只有確定單機時才用 SQLite」。</p>' },
      { id: 'ollama', st: 'timeout', fail: '逾時（300 秒內沒有完成）', text: '' },
    ], draft: '<p>若部署確定為<b>單機</b>，使用 SQLite（WAL）並從第一天經由 ORM 存取；若可能多台部署或需要多人同時大量寫入，直接採用 PostgreSQL。</p>', draftBy: 'claude',
    judge: { kind: 'jev', outcome: 'not_reached', p: 0.62, th: 0.8 },
    notices: [{ kind: 'mod', text: '改由 Claude Code 擔任主持人', label: '主持人接手' }] },
  { n: 3, live: true, turns: [
      { id: 'claude', st: 'running', text: '<p>同意新版草案。這個版本把決策條件寫清楚了：關鍵不是「哪個比較好」，而是部署形態。我再補一點，若選 SQLite，記得' },
      { id: 'codex', st: 'ok', stance: 'AGREE', text: '<p>同意。把「是否多台部署」當作分界很合理，也避免了「之後再遷移」的模糊空間。</p>' },
      { id: 'ollama', st: 'failed', fail: '連線失敗：無法連到 http://127.0.0.1:11434', text: '' },
    ], draft: null, judge: null,
    notices: [{ kind: 'bad', text: 'Ollama：連續 2 輪失敗', label: '移出討論' }] },
]
const QUEUE = [{ text: '補充：我們之後可能會把服務放到兩台機器上。', round: 4 }]
const FINAL_OK = '<p><b>建議：</b>部署形態決定選擇。</p><ul><li>確定單機：SQLite（WAL 模式），從第一天經由 ORM 存取。</li><li>可能多台部署或大量同時寫入：直接採用 PostgreSQL。</li></ul><p>依使用者補充「之後可能放到兩台機器」，本案應直接採用 <b>PostgreSQL</b>。</p>'
const FINAL_NO = '<p><b>各參與者最終立場</b></p><ul><li>Claude Code：單機用 SQLite，多機再遷移。</li><li>Codex：預設 PostgreSQL，遷移成本不應低估。</li></ul><p><b>仍有分歧的重點</b></p><ul><li>「之後再遷移」的成本是否可接受。</li><li>5 人團隊是否值得一開始就維運 PostgreSQL。</li></ul>'
const HIST = [
  { q: QUESTION, mode: '共識討論', t: '10/20 21:14', day: '今天', o: 'consensus', ps: ['claude', 'codex', 'ollama'], rounds: 4 },
  { q: 'Rust 的 async 生態，tokio 以外還有值得選的 runtime 嗎？', mode: '提問', t: '10/20 18:02', day: '今天', o: 'completed', ps: ['claude', 'codex'], rounds: 1 },
  { q: '要不要把 monorepo 拆成多個 repo？', mode: '共識討論', t: '10/19 23:40', day: '昨天', o: 'no_consensus', ps: ['claude', 'codex', 'ollama'], rounds: 15 },
  { q: '如何設計一個不會被濫用的邀請碼系統？', mode: '共識討論', t: '10/19 15:21', day: '昨天', o: 'stopped', ps: ['claude', 'codex'], rounds: 2 },
  { q: '本機 LLM 跑 8B 模型，16GB RAM 夠嗎？', mode: '共識討論', t: '10/18 11:05', day: '10 月 18 日', o: 'insufficient_participants', ps: ['codex', 'ollama'], rounds: 3 },
]
const OUT = { consensus: '取得共識', completed: '已完成', no_consensus: '未取得共識', stopped: '已停止', insufficient_participants: '參與者不足', error: '發生錯誤' }
const TST = { running: '回覆中', ok: '完成', failed: '失敗', timeout: '逾時' }
const STANCE = { AGREE: '同意', DISAGREE: '不同意' }

// ------------------------------------------------------------------ routing / switcher
const VARIANTS = { A: 'Studio（深色三欄工作台）', B: 'Agora（暖紙編輯排版）', C: 'Roundtable（圓桌焦點）' }
const SCREENS = { settings: '設定', live: '討論中', consensus: '共識結果', noconsensus: '未共識', history: '歷史', record: '唯讀紀錄' }
const qs = new URLSearchParams(location.search)
let variant = VARIANTS[qs.get('variant')] ? qs.get('variant') : 'A'
let screen = SCREENS[qs.get('screen')] ? qs.get('screen') : 'live'
function go(v, s) {
  variant = v; screen = s
  const u = new URL(location.href); u.searchParams.set('variant', v); u.searchParams.set('screen', s)
  history.replaceState(null, '', u); render()
}
function bar() {
  const keys = Object.keys(VARIANTS), i = keys.indexOf(variant)
  const prev = keys[(i + keys.length - 1) % keys.length], next = keys[(i + 1) % keys.length]
  document.getElementById('proto-bar').innerHTML =
    `<button onclick="go('${prev}','${screen}')">◀</button><span class="lbl">${variant} · ${VARIANTS[variant]}</span><button onclick="go('${next}','${screen}')">▶</button><span class="sep"></span>` +
    Object.entries(SCREENS).map(([k, l]) => `<button class="${k === screen ? 'on' : ''}" onclick="go('${variant}','${k}')">${l}</button>`).join('')
}
addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea,[contenteditable]')) return
  const keys = Object.keys(VARIANTS), i = keys.indexOf(variant)
  if (e.key === 'ArrowRight') go(keys[(i + 1) % keys.length], screen)
  if (e.key === 'ArrowLeft') go(keys[(i + keys.length - 1) % keys.length], screen)
})

// ------------------------------------------------------------------ helpers
const av = (id, s = 28) => `<img class="av" src="${AV(P[id].avatar)}" width="${s}" height="${s}" alt="">`
const noWeb = (id, cls = 'tag') => P[id].web ? '' : `<span class="${cls}">無上網</span>`
const isLive = () => screen === 'live'
const isRecord = () => screen === 'record'
const finished = () => !isLive()
const outcome = () => screen === 'noconsensus' ? 'no_consensus' : 'consensus'
// Rounds as shown on this screen: live = rounds 1–3 with round 3 running; finished = round 3 done + round 4.
function rounds() {
  if (isLive()) return R
  const r3 = { ...R[2], live: false, turns: R[2].turns.map((t) => t.id === 'claude' ? { ...t, st: 'ok', stance: 'AGREE', text: t.text + '開啟 WAL 與定期備份。</p>' } : t),
    draft: R[1].draft, draftBy: 'claude', judge: { kind: 'jev', outcome: 'not_reached', p: 0.74, th: 0.8 } }
  const nc = outcome() === 'no_consensus'
  const r4 = { n: 4, turns: [
      { id: 'claude', st: 'ok', stance: 'AGREE', text: '<p>考慮使用者補充的兩台機器，草案的條件已經指向 PostgreSQL。同意。</p>' },
      { id: 'codex', st: 'ok', stance: nc ? 'DISAGREE' : 'AGREE', text: nc ? '<p>仍然認為草案應該把 PostgreSQL 當預設，而不是條件式。</p>' : '<p>同意，這樣結論就清楚了。</p>' },
    ], draft: nc ? null : FINAL_OK, draftBy: 'claude', judge: nc ? { kind: 'jev', outcome: 'not_reached', p: 0.55, th: 0.8 } : { kind: 'jev', outcome: 'reached', p: 0.91, th: 0.8 },
    confirms: nc ? null : [{ id: 'claude', agree: true }, { id: 'codex', agree: true }], interject: QUEUE[0].text }
  return [R[0], R[1], r3, r4]
}
const judgeText = (j) => j.outcome === 'reached' ? '反問全員同意，取得共識' : j.outcome === 'confirm' ? '達到門檻，需要反問確認' : '未取得共識'
const gaugeSvg = (p, th, size = 74) => {
  const r = size / 2 - 7, c = 2 * Math.PI * r, col = p >= th ? 'var(--ok)' : 'var(--warn)'
  const a = 2 * Math.PI * th - Math.PI / 2, tx = size / 2 + r * Math.cos(a), ty = size / 2 + r * Math.sin(a)
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/>
  <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
  <circle cx="${tx}" cy="${ty}" r="3.5" fill="var(--ink)"/></svg>`
}

// ================================================================== A — Studio
function A() {
  const side = `<aside class="side"><div class="brand"><img src="${ICON}" width="24" height="24">AIgora</div>
    <button class="newbtn" onclick="go('A','settings')">＋ 新討論</button>
    <div class="navlbl">歷史</div>

      <div class="fld"><label>發言順序</label><select><option>同時</option><option disabled>依序（尚未提供）</option></select></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="fld"><label>輪數上限</label><input type="number" value="15"></div><div class="fld"><label>逾時（秒）</label><input type="number" value="300"></div></div></div>
    <div class="sec"><button class="btn pri" style="width:100%">開始討論　Ctrl+Enter</button><p style="color:var(--mut);font-size:12px;margin-top:8px">已選 3 個參與者 · 預設值來自 participants.toml</p></div></aside></div>`
  if (screen === 'history') return `<div class="shell no-insp">${side}<main class="stage"><div class="topbar"><h1>歷史</h1><span class="pill">${HIST.length} 場討論</span></div><div class="scroll">
    <table class="hist"><tr><th>問題</th><th>模式</th><th>參與者</th><th>輪</th><th>開始時間</th><th>結果</th></tr>
    ${HIST.map((h) => `<tr onclick="go('A','record')"><td>${h.q}</td><td style="color:var(--mut)">${h.mode}</td><td><div class="stack">${h.ps.map((p) => av(p, 22)).join('')}</div></td><td style="color:var(--mut)">${h.rounds}</td><td style="color:var(--mut)">${h.t}</td><td><span class="pill ${h.o === 'consensus' ? 'ok' : h.o === 'no_consensus' ? 'warn' : h.o === 'completed' ? '' : 'bad'}">${OUT[h.o]}</span></td></tr>`).join('')}</table></div></main></div>`
  const rs = rounds(), live = isLive(), o = outcome()
  const turn = (t) => `<div class="turn ${t.st === 'timeout' ? 'failed' : t.st}"><div class="turn-h">${av(t.id, 22)}<span class="n">${P[t.id].name}</span>${P[t.id].web ? '' : '<span class="pill warn">無上網</span>'}<span class="st pill ${t.st === 'running' ? 'run' : t.st === 'ok' ? '' : 'bad'}">${TST[t.st]}</span></div>
    ${t.fail ? `<p class="fail">${t.fail}</p>` : ''}<div class="md ${t.st === 'running' ? 'caret' : ''}" ${t.st === 'running' ? 'id="stream"' : ''}>${t.text}</div>${t.stance ? `<div class="stance ${t.stance}">STANCE: ${t.stance} · ${STANCE[t.stance]}</div>` : ''}</div>`
  const round = (r) => `<section class="rnd"><div class="rnd-h"><b>第 ${r.n} 輪</b>${r.live ? '<span class="pill run">進行中</span>' : ''}${r.interject ? `<span class="pill">含插話</span>` : ''}</div>
    <div class="cols" style="--n:${r.turns.length}">${r.turns.map(turn).join('')}</div>
    ${(r.notices || []).map((n) => `<div class="notice ${n.kind === 'bad' ? 'bad' : ''}"><b>${n.label}</b>${n.text}</div>`).join('')}
    ${r.draft || r.judge ? `<div class="between">${r.draft ? `<div class="draft"><div class="blk-h"><b>${r.n === 4 && o === 'consensus' ? '最終共識結果' : '共識草案'}</b><span>第 ${r.n} 輪後 · 主持人</span>${av(r.draftBy, 16)}${P[r.draftBy].name}</div><div class="md">${r.draft}</div></div>` : '<div></div>'}
    ${r.judge ? `<div class="judge"><div class="blk-h"><b>Jev 判斷</b><span class="pill ${r.judge.outcome === 'reached' ? 'ok' : 'warn'}" style="margin-left:auto">${judgeText(r.judge)}</span></div>已取得共識的機率 <b>${r.judge.p.toFixed(2)}</b>（門檻 ${r.judge.th}）<div class="bar"><i style="width:${r.judge.p * 100}%;${r.judge.p >= r.judge.th ? 'background:var(--ok)' : ''}"></i><s style="left:${r.judge.th * 100}%"></s></div>
      ${r.confirms ? `<div style="margin-top:8px;color:var(--mut)">反問確認：${r.confirms.map((c) => `${P[c.id].name} <span style="color:var(--ok)">同意</span>`).join('、')}</div>` : ''}</div>` : '<div></div>'}</div>` : ''}</section>`
  const result = finished() ? `<div class="result ${o === 'no_consensus' ? 'no' : ''}"><h2>${o === 'consensus' ? '✓ 共識結果' : '未取得共識：各參與者最終立場與仍有分歧的重點'}<span class="pill" style="margin-left:auto">${o === 'consensus' ? '第 4 輪取得共識' : '到達輪數上限'}</span></h2><div class="md">${o === 'consensus' ? FINAL_OK : FINAL_NO}</div></div>` : ''
  const ins = `<aside class="insp">
    <div class="sec"><h3>參與者</h3>${SEL.map((id) => { const t = rs[rs.length - 1].turns.find((x) => x.id === id); const rem = id === 'ollama'; return `<div class="seat ${rem ? 'removed' : ''}">${av(id, 22)}<span>${P[id].name}${id === 'claude' ? ' <span class="pill">主持人</span>' : ''}</span><span class="s pill ${rem ? 'bad' : t?.st === 'running' ? 'run' : ''}">${rem ? '已移出' : t ? TST[t.st] : '—'}</span></div>` }).join('')}</div>
    <div class="sec"><h3>表態追蹤</h3><div class="track"><span></span>${['claude', 'codex', 'ollama'].map((id) => `<span style="text-align:center">${av(id, 18)}</span>`).join('')}
      ${rs.slice(1).map((r) => `<span style="color:var(--mut)">第 ${r.n} 輪</span>${['claude', 'codex', 'ollama'].map((id) => { const t = r.turns.find((x) => x.id === id); return `<span class="dot ${t ? (t.stance || (t.st !== 'ok' && t.st !== 'running' ? 'failed' : '')) : ''}"></span>` }).join('')}`).join('')}</div>
      <p style="color:var(--mut);font-size:11.5px;margin-top:8px">● 同意　● 不同意　○ 失敗</p></div>
    <div class="sec"><h3>插話佇列</h3>${live ? `<ul class="queue">${QUEUE.map((q) => `<li><small>第 ${q.round} 輪起生效</small>${q.text}</li>`).join('')}</ul>` : '<p style="color:var(--mut)">第 4 輪已套用 1 則插話</p>'}</div>
    <div class="sec"><h3>設定（已鎖定）</h3><div class="kv"><span>模式</span><span>共識討論</span><span>裁定</span><span>Jev 判斷 + 反問確認</span><span>門檻</span><span>0.8</span><span>發言順序</span><span>同時</span><span>輪數上限</span><span>15</span><span>逾時</span><span>300 秒</span></div></div></aside>`
  const status = live ? '<span class="pill run">● 討論中 · 第 3 輪</span>' : `<span class="pill ${o === 'consensus' ? 'ok' : 'warn'}">${OUT[o]}</span>`
  return `<div class="shell">${side}<main class="stage"><div class="topbar"><h1>${QUESTION}</h1>${isRecord() ? '<span class="ro">唯讀紀錄</span>' : ''}${status}${live ? '<button class="btn danger">■ 停止</button>' : isRecord() ? '' : '<button class="btn">以此開始新討論</button>'}</div>
    <div class="scroll">${result}${rs.map(round).join('')}</div>
    ${live ? `<div class="dock"><textarea placeholder="插話：補充資訊或修正問題；從下一輪開始生效（Ctrl+Enter 送出）"></textarea><button class="btn pri">送出插話</button></div>` : ''}</main>${ins}</div>`
}

// ================================================================== B — Agora
function B() {
  const top = `<header class="top"><img src="${ICON}" width="28" height="28"><span class="name serif">AIgora</span><nav><a href="#" class="${screen === 'history' ? '' : 'cur'}" onclick="go('B','settings');return false">討論</a><a href="#" class="${screen === 'history' ? 'cur' : ''}" onclick="go('B','history');return false">歷史</a></nav></header>`
  if (screen === 'settings') return `${top}<div class="wrap"><div class="hero"><img src="${ICON}" width="72" height="72"><h1 class="serif">今天想讓大家討論什麼？</h1><p>提出一個問題，讓多個 AI 一起回答或討論出共識。</p></div>
    <div class="composer"><textarea placeholder="輸入要問參與者的問題">${QUESTION}</textarea>
      <div class="seats">${Object.keys(P).map((id) => { const p = P[id]; return `<span class="chip ${SEL.includes(id) ? 'on' : ''} ${p.ok ? '' : 'dis'}" title="${p.ok ? '' : p.why}">${av(id, 26)}${p.name}${noWeb(id)}${p.ok ? '' : `<span class="tag bad">不可用</span>`}</span>` }).join('')}</div>

      <div class="go"><span style="color:var(--mut);font-size:13px">Gemini 不可用：找不到 gemini CLI</span><button class="btn pri">開始討論 →</button></div></div></div>`
  if (screen === 'history') {
    const days = [...new Set(HIST.map((h) => h.day))]
    return `${top}<div class="wrap journal"><div class="qhead" style="grid-template-columns:1fr"><div><div class="kick">ARCHIVE</div><h1 class="serif">歷史</h1><div class="meta">${HIST.length} 場討論 · 皆為唯讀</div></div></div>
      ${days.map((d) => `<h2 class="day">${d}</h2>${HIST.filter((h) => h.day === d).map((h) => `<div class="entry" onclick="go('B','record')"><time>${h.t.split(' ')[1]}</time><div><h3 class="serif">${h.q}</h3><div class="sub">${h.ps.map((p) => av(p, 18)).join('')}<span>${h.mode} · ${h.rounds} 輪</span></div></div><span class="tag ${h.o === 'consensus' ? '' : h.o === 'no_consensus' || h.o === 'completed' ? '' : 'bad'}" style="${h.o === 'consensus' ? 'background:#e1efe6;color:var(--ok)' : ''}">${OUT[h.o]}</span></div>`).join('')}`).join('')}</div>`
  }
  const rs = rounds(), live = isLive(), o = outcome()
  const col = (t) => `<div class="col ${t.st === 'ok' || t.st === 'running' ? '' : 'failed'}"><div class="byline">${av(t.id, 30)}<span class="n">${P[t.id].name}</span>${noWeb(t.id)}<span class="st">${TST[t.st]}</span></div>
    ${t.fail ? `<p class="fail">${t.fail}</p>` : ''}<div class="md ${t.st === 'running' ? 'caret' : ''}" ${t.st === 'running' ? 'id="stream"' : ''}>${t.text}</div>${t.stance ? `<div class="stance ${t.stance}">— ${STANCE[t.stance]}草案</div>` : ''}</div>`
  const round = (r) => `<section class="rnd" id="r${r.n}"><h2>第 ${r.n} 輪${r.live ? '・進行中' : ''}</h2>
    ${r.interject ? `<p class="margin">本輪起套用使用者插話：「${r.interject}」</p><br>` : ''}
    <div class="cols" style="--n:${r.turns.length}">${r.turns.map(col).join('')}</div>
    ${(r.notices || []).map((n) => `<p class="margin ${n.kind === 'bad' ? 'bad' : ''}">${n.label}：${n.text}</p>`).join('')}
    ${r.draft && !(r.n === 4 && o === 'consensus') ? `<div class="pull"><div class="lbl">共識草案 <span style="color:var(--mut);letter-spacing:0;font-weight:normal">第 ${r.n} 輪後，由主持人 ${P[r.draftBy].name} 整理</span></div><div class="md serif">${r.draft}</div>
      ${r.judge ? `<div class="verdict">Jev 判斷 <b style="color:var(--ink)">${r.judge.p.toFixed(2)}</b><span class="meter"><i style="width:${r.judge.p * 100}%"></i><s style="left:${r.judge.th * 100}%"></s></span>門檻 ${r.judge.th} · ${judgeText(r.judge)}</div>` : ''}</div>` : ''}
    ${!r.draft && r.judge ? `<div class="verdict">Jev 判斷 <b style="color:var(--ink)">${r.judge.p.toFixed(2)}</b><span class="meter"><i style="width:${r.judge.p * 100}%"></i><s style="left:${r.judge.th * 100}%"></s></span>門檻 ${r.judge.th} · ${judgeText(r.judge)}</div>` : ''}
    ${r.confirms ? `<div class="verdict">Jev 判斷 <b style="color:var(--ink)">${r.judge.p.toFixed(2)}</b> 達到門檻 → 反問確認：${r.confirms.map((c) => `${P[c.id].name} 同意`).join('、')}</div>` : ''}</section>`
  const final = finished() ? `<div class="final ${o === 'no_consensus' ? 'no' : ''}"><div class="lbl">${o === 'consensus' ? '共識結果' : '未取得共識'}</div><h2 class="serif">${o === 'consensus' ? '依部署形態決定；本案採用 PostgreSQL' : '各參與者最終立場與仍有分歧的重點'}</h2><div class="md serif">${o === 'consensus' ? FINAL_OK : FINAL_NO}</div>
    <div class="sign">${SEL.slice(0, 2).map((p) => av(p, 20)).join('')}<span>${o === 'consensus' ? '第 4 輪 · 反問確認全員同意 · 主持人 Claude Code 撰寫' : '到達輪數上限 · 主持人 Claude Code 整理'}</span></div></div>` : ''
  const rail = `<nav class="rail">${rs.map((r) => `<a href="#r${r.n}" class="${r.live ? 'cur' : ''}"><span class="d ${r.live ? 'live' : r.judge?.outcome === 'reached' ? 'win' : 'done'}"></span>第 ${r.n} 輪</a>`).join('')}${finished() ? `<a href="#"><span class="d ${o === 'consensus' ? 'win' : 'done'}"></span>${o === 'consensus' ? '共識' : '分歧整理'}</a>` : ''}</nav>`
  return `${top}<div class="wrap"><div class="qhead"><div><div class="kick">共識討論 · Jev 判斷 + 反問確認${isRecord() ? ' · 唯讀紀錄' : ''}</div><h1 class="serif">${QUESTION}</h1>

    ${isRecord() ? '<p class="ro">這是過去討論的唯讀紀錄，設定與內容不可變更。</p>' : ''}
    ${final}<div class="layout">${rail}<div>${rs.map(round).join('')}</div></div></div>
    ${live ? `<div class="dock"><div class="in"><div class="queued">${QUEUE.map((q) => `<span>插話・第 ${q.round} 輪起生效：${q.text}</span>`).join('')}</div><div class="row"><input placeholder="插話：補充資訊或修正問題，從下一輪開始生效"><button class="btn pri">送出</button></div></div></div>` : ''}`
}

let cRound = null
function C() {

    <div class="tiles">${Object.keys(P).map((id) => { const p = P[id]; return `<div class="card tile ${SEL.includes(id) ? 'on' : ''} ${p.ok ? '' : 'dis'}">${av(id, 56)}<div class="n">${p.name}</div><div class="m">${p.adapter} · ${p.model}</div><div class="tags">${p.web ? '' : '<span class="tag warn">無上網</span>'}${p.ok ? '' : `<span class="tag bad">不可用：${p.why}</span>`}${id === 'claude' ? '<span class="tag acc">👑 主持人</span>' : ''}</div></div>` }).join('')}</div>

    <h2 class="step"><i>3</i>共識討論設定</h2>
    <div class="card adv"><div class="fld">共識裁定方式<div class="seg"><span class="on">主持人 + 全員表態</span><span class="dis" title="不可用：.env 沒有 TYPESAFE_API_KEY">Jev 判斷（需金鑰）</span></div></div>
      <div class="fld">主持人<select><option>Claude Code</option><option>Codex</option><option>Ollama</option></select></div>
      <div class="fld">發言順序<div class="seg"><span class="on">同時</span><span class="dis">依序（尚未提供）</span></div></div>
      <div class="fld">輪數上限<input type="number" value="15"></div><div class="fld">逾時（秒）<input type="number" value="300"></div></div>
    <div class="askbar"><div class="card in"><textarea rows="1" placeholder="輸入要問參與者的問題">${QUESTION}</textarea><button class="btn pri">開始討論</button></div></div></div>`
  if (screen === 'history') return `${top()}<div class="wrap"><h2 class="step" style="margin-top:4px">歷史 <span class="tag">${HIST.length} 場</span></h2><div class="hgrid">
    ${HIST.map((h) => `<div class="card hcard ${h.o}" onclick="go('C','record')"><div class="f"><span class="tag">${h.mode}</span><span>${h.t}</span><span class="tag ${h.o === 'consensus' ? 'ok' : h.o === 'no_consensus' ? 'warn' : h.o === 'completed' ? 'acc' : 'bad'}" style="margin-left:auto">${OUT[h.o]}</span></div><h3>${h.q}</h3><div class="f"><div class="stack">${h.ps.map((p) => av(p, 26)).join('')}</div><span>${h.rounds} 輪</span></div></div>`).join('')}</div></div>`
  const rs = rounds(), live = isLive(), o = outcome()

  const r = rs[cRound - 1], last = rs[rs.length - 1]
  const seatState = (id) => id === 'ollama' ? 'removed' : (last.turns.find((t) => t.id === id)?.st ?? 'ok')
  const seats = `<div class="seatrow">${SEL.map((id) => { const s = seatState(id); return `<div class="seatc ${s}"><div class="ring ${s === 'timeout' ? 'failed' : s}">${av(id, 52)}</div>${id === 'claude' ? '<span class="crown">👑</span>' : ''}<b>${P[id].name}</b><br><span style="color:var(--mut)">${s === 'removed' ? '已移出' : TST[s]}</span></div>` }).join('')}</div>`
  const turn = (t) => `<div class="card turn ${t.st === 'timeout' ? 'failed' : t.st}"><div class="turn-h">${av(t.id, 30)}<span class="n">${P[t.id].name}</span>${P[t.id].web ? '' : '<span class="tag warn" style="margin-left:4px">無上網</span>'}
    <span class="tag ${t.stance === 'AGREE' ? 'ok' : t.stance === 'DISAGREE' ? 'bad' : t.st === 'running' ? 'acc' : t.st === 'ok' ? '' : 'bad'}">${t.stance ? STANCE[t.stance] : TST[t.st]}</span></div>
    ${t.fail ? `<p class="fail">⚠ ${t.fail}</p>` : ''}<div class="md ${t.st === 'running' ? 'caret' : ''}" ${t.st === 'running' ? 'id="stream"' : ''}>${t.text}</div></div>`
  const j = r.judge || (live && cRound === rs.length ? null : null)
  const agree = r.turns.filter((t) => t.stance === 'AGREE').length
  const side = `<div class="side">
    ${r.judge ? `<div class="card"><h3>Jev 判斷 · 第 ${r.n} 輪</h3><div class="gauge">${gaugeSvg(r.judge.p, r.judge.th)}<div><div class="num">${Math.round(r.judge.p * 100)}%</div><div style="color:var(--mut);font-size:13px">門檻 ${r.judge.th * 100}% · ${judgeText(r.judge)}</div></div></div>
      ${r.confirms ? `<div class="votes">${r.confirms.map((c) => `<div>${av(c.id, 20)}${P[c.id].name}<span class="tag ok">反問：同意</span></div>`).join('')}</div>` : ''}</div>` : r.n > 1 ? `<div class="card"><h3>表態 · 第 ${r.n} 輪</h3><div class="votes">${r.turns.map((t) => `<div>${av(t.id, 20)}${P[t.id].name}<span class="tag ${t.stance === 'AGREE' ? 'ok' : t.stance ? 'bad' : t.st === 'running' ? 'acc' : 'bad'}">${t.stance ? STANCE[t.stance] : t.st === 'running' ? '回覆中' : '未表態'}</span></div>`).join('')}</div><p style="color:var(--mut);font-size:12.5px;margin-top:8px">${agree} / ${r.turns.length} 同意 · 等待本輪結束後判斷</p></div>` : ''}
    ${r.draft ? `<div class="card draft"><h3>📝 ${r.n === 4 && o === 'consensus' ? '最終共識結果' : '共識草案'} · 第 ${r.n} 輪後 <span class="tag" style="margin-left:auto">${av(r.draftBy, 16)} ${P[r.draftBy].name}</span></h3><div class="md">${r.draft}</div></div>` : live && r.live ? `<div class="card draft"><h3>📝 共識草案</h3><p style="color:var(--mut)">本輪結束後由主持人 Claude Code 整理。</p></div>` : ''}
    ${live ? `<div class="card queue"><h3>💬 插話佇列</h3>${QUEUE.map((q) => `<span><small>第 ${q.round} 輪起生效</small>${q.text}</span>`).join('')}</div>` : ''}</div>`
  const banner = finished() ? `<div class="banner ${o === 'no_consensus' ? 'no' : ''}"><div class="big">${o === 'consensus' ? '🤝' : '⚖️'}</div><div style="flex:1"><h2>${o === 'consensus' ? '取得共識！第 4 輪反問確認全員同意' : '未取得共識：到達輪數上限'}</h2><div style="opacity:.9">${o === 'consensus' ? '共識結果' : '各參與者最終立場與仍有分歧的重點'} · 主持人 Claude Code 撰寫</div><div class="md">${o === 'consensus' ? FINAL_OK : FINAL_NO}</div></div></div>` : ''
  const tabs = `<div class="tabs">${rs.map((x) => `<a href="#" class="${x.n === cRound ? 'cur' : ''}" onclick="cRound=${x.n};render();return false"><i class="${x.live ? 'live' : ''}"></i>第 ${x.n} 輪${x.live ? ' · 進行中' : ''}</a>`).join('')}${live ? '<span style="color:var(--mut);font-size:13px;margin-left:6px">上限 15 輪 · Jev 判斷 + 反問確認</span>' : ''}</div>`
  const status = live ? '<span class="tag acc">● 討論中 · 第 3 輪</span><button class="btn danger">■ 停止</button>' : `<span class="tag ${o === 'consensus' ? 'ok' : 'warn'}">${OUT[o]}</span>`
  return `${top(status)}<div class="wrap">${isRecord() ? '<span class="ro">📖 唯讀紀錄 · 10/20 21:14</span>' : ''}
    <div class="card table"><div class="q"><div class="k">共識討論 · 同時發言 · 主持人 Claude Code</div><h1>${QUESTION}</h1></div>${seats}</div>
    ${banner}${tabs}
    ${r.interject ? `<div class="notes"><div class="note" style="background:var(--acc2)"><b>💬 本輪起套用插話</b>${r.interject}</div></div><br>` : ''}
    <div class="grid"><div><div class="cols" style="--n:${r.turns.length}">${r.turns.map(turn).join('')}</div>
      <div class="notes">${(r.notices || []).map((n) => `<div class="note ${n.kind === 'bad' ? 'bad' : ''}"><b>${n.kind === 'bad' ? '🚪' : '👑'} ${n.label}</b>${n.text}</div>`).join('')}</div></div>${side}</div>
    ${live ? `<div class="askbar"><div class="card in"><span style="font-size:20px">💬</span><input placeholder="插話：補充資訊或修正問題，從下一輪開始生效"><button class="btn pri">送出插話</button></div></div>` : ''}</div>`
}

// ------------------------------------------------------------------ render + fake streaming
let timer
let theme = qs.get('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
function render() {
  document.body.className = 'v' + variant + (variant === 'A' && theme === 'light' ? ' light' : '')
  document.getElementById('app').innerHTML = { A, B, C }[variant]()
  bar()
  clearInterval(timer)
  const words = '開啟 WAL 模式、設定 busy_timeout，並把資料庫檔案納入每日備份。這三件事做好，5 人規模不會遇到問題。'.split('')
  let i = 0
  timer = setInterval(() => {
    const el = document.getElementById('stream')
    if (!el || i >= words.length) return clearInterval(timer)
    el.lastElementChild ? (el.lastElementChild.textContent += words[i++]) : (el.textContent += words[i++])
  }, 120)
}
render()
</script>
</body>
</html>
