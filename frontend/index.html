<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <title>AIgora</title>
    <script>
      // Apply the stored theme before the app loads, so the page does not flash the other
      // theme. Must match THEME_STORAGE_KEY in src/composables/useTheme.ts.
      try {
        var theme = localStorage.getItem('aigora.theme')
        if (theme === 'light' || theme === 'dark')
          document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
