# Participants for Playwright E2E: Fake Adapter only, so no AI quota is spent.
# Tickets that need specific fake behaviour may add participants here.

[defaults]
mode = "ask"
judge = "stance_vote"
speaking_order = "parallel"
max_rounds = 15
turn_timeout_seconds = 300
jev_threshold = 0.8

[[participant]]
id = "fake-a"
display_name = "Fake A"
adapter = "fake"

[[participant]]
id = "fake-b"
display_name = "Fake B"
adapter = "fake"

# Ticket 03: streams slowly so the E2E test can see text arriving.
[[participant]]
id = "fake-slow"
display_name = "Fake Slow"
adapter = "fake"
[participant.options]
replies = ["Streaming slowly, a few characters at a time, until the end."]
chunk_chars = 4
chunk_delay_seconds = 0.15

# Ticket 03: no web access (shows the 無上網 mark).
[[participant]]
id = "fake-offline"
display_name = "Fake Offline"
adapter = "fake"
[participant.options]
web_access = false

# Ticket 05: unavailable (shows the reason; cannot be picked).
[[participant]]
id = "fake-down"
display_name = "Fake Down"
adapter = "fake"
[participant.options]
available = false
unavailable_reason = "fake: CLI not installed"
