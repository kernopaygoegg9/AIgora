# Participants for Playwright E2E: Fake Adapter only, so no AI quota is spent.
# Tickets that need specific fake behaviour may add participants here.

[defaults]
mode = "ask"
judge = "stance_vote"
speaking_order = "parallel"
max_rounds = 15
turn_timeout_seconds = 300
jev_threshold = 0.8

# Ticket 09: `models` fills the model picker (ticket 11).
[[participant]]
id = "fake-a"
display_name = "Fake A"
adapter = "fake"
[participant.options]
models = ["fake-small", "fake-large"]

[[participant]]
id = "fake-b"
display_name = "Fake B"
adapter = "fake"
[participant.options]
models = ["fake-small", "fake-large"]

# Ticket 03: streams slowly so the E2E test can see text arriving.
[[participant]]
id = "fake-slow"
display_name = "Fake Slow"
adapter = "fake"
[participant.options]
replies = ["Streaming slowly, a few characters at a time, until the end."]
chunk_chars = 4
chunk_delay_seconds = 0.15

# Ticket 03: no web access (shows the 無上網 mark).
[[participant]]
id = "fake-offline"
display_name = "Fake Offline"
adapter = "fake"
[participant.options]
web_access = false

# Ticket 06: replies with the prompt it received (shows interjections) after a pause,
# so a test can interject while round 1 is still running.
[[participant]]
id = "fake-echo"
display_name = "Fake Echo"
adapter = "fake"
[participant.options]
echo_prompt = true
stream = false
delay_seconds = 1.5

# Ticket 06: never finishes on its own, so a test can stop it mid-turn.
[[participant]]
id = "fake-sleepy"
display_name = "Fake Sleepy"
adapter = "fake"
[participant.options]
delay_seconds = 600

# Ticket 05: unavailable (shows the reason; cannot be picked).
[[participant]]
id = "fake-down"
display_name = "Fake Down"
adapter = "fake"
[participant.options]
available = false
unavailable_reason = "fake: CLI not installed"

# Ticket 07: every normal turn fails in rounds 1 and 2, so it is removed after round 2
# (and, as moderator, hands over to the next participant).
[[participant]]
id = "fake-flaky"
display_name = "Fake Flaky"
adapter = "fake"
[participant.options]
stream = false
fail_rounds = [1, 2]
fail_reason = "fake: simulated crash"

# Code review fix: disabled, so the browser never sees it, but the backend still rejects an
# extra participant id equal to it. Its id is what an extra copied from Fake A used to get.
[[participant]]
id = "fake-a-2"
display_name = "Fake A Retired"
adapter = "fake"
enabled = false
